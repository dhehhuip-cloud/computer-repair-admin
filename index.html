<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a30">
<title>PC REPAIR SYSTEM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f1f4f8;color:#10203a}
header{height:66px;background:#101a30;color:white;display:flex;align-items:center}
.head{width:min(1000px,calc(100% - 32px));margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:800}.sub{font-size:11px;color:#9eacc5;margin-top:3px}
button{border:0;border-radius:18px;padding:9px 16px;cursor:pointer;font-size:13px}
.logout{background:white;color:#17233a}
main{width:min(1000px,calc(100% - 32px));margin:18px auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:white;border-radius:16px;padding:16px;box-shadow:0 1px 2px #dfe4ec}
.stat .label{font-size:11px;color:#75839a}.stat .num{font-size:25px;font-weight:800;margin-top:5px}
.new .num{color:#e33}.talk .num{color:#d99300}.done .num{color:#6782a6}
.layout{display:grid;grid-template-columns:388px 1fr;gap:18px}
.panel{background:white;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px #dfe4ec}
.panel-title{padding:16px;border-bottom:1px solid #e6eaf0;font-weight:800;display:flex;justify-content:space-between}
.refresh{background:none;color:#6354e8;padding:0}
.list{max-height:510px;overflow:auto}
.item{padding:15px;border-bottom:1px solid #e7ebf1;cursor:pointer}
.item:hover,.item.selected{background:#f8f9fc}
.item .name{font-weight:800}.item .type{font-size:12px;color:#56657c;margin-top:5px}
.item .time{font-size:11px;color:#91a0b5;margin-top:8px}
.badge{float:right;background:#e9eef4;border-radius:14px;padding:5px 9px;font-size:10px;color:#5c6c80}
.chat{display:flex;flex-direction:column;height:510px}
.chat-head{padding:16px;border-bottom:1px solid #e6eaf0}
.chat-head h2{font-size:17px;margin:0 0 6px}.meta{font-size:12px;color:#6c7c93}
.chat-msgs{flex:1;overflow:auto;padding:14px 18px;background:#fff}
.bubble{max-width:78%;padding:11px 13px;border-radius:14px;margin:8px 0;font-size:13px}
.bubble.student{background:#edf2f8;margin-right:auto}.bubble.admin{background:#5144e9;color:white;margin-left:auto}
.sender{font-size:10px;opacity:.65;margin-bottom:6px}.when{font-size:9px;opacity:.6;margin-top:8px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e6eaf0}
.composer input{flex:1;border:1px solid #d8dee8;border-radius:20px;padding:11px 14px;outline:none}
.send{background:#5144e9;color:white}
.statusbar{display:flex;gap:7px;padding:10px 12px;border-top:1px solid #e6eaf0}
.statusbar button{background:#eef2f6;color:#4e6078;font-size:11px}
.statusbar button:hover{background:#dfe6ef}
.login{position:fixed;inset:0;background:#101a30;display:flex;align-items:center;justify-content:center}
.loginbox{background:white;width:min(360px,calc(100% - 36px));padding:28px;border-radius:18px}
.loginbox h1{margin:0 0 8px;font-size:22px}.loginbox p{color:#738096;font-size:12px}
.loginbox input{width:100%;padding:12px;border:1px solid #d8dee8;border-radius:10px;margin:10px 0}
.loginbox button{width:100%;background:#5144e9;color:white;border-radius:10px}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#8190a6;font-size:13px}
@media(max-width:760px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .layout{grid-template-columns:1fr}
 .list{max-height:330px}.chat{height:560px}
}
</style>
</head>
<body>
<header><div class="head"><div><div class="logo">🖥️ PC REPAIR SYSTEM</div><div class="sub">학교 컴퓨터 고장 신고 관리자</div></div><button class="logout" onclick="logout()">로그아웃</button></div></header>
<main>
<div class="stats">
<div class="stat"><div class="label">전체 신고</div><div class="num" id="total">0</div></div>
<div class="stat new"><div class="label">새 신고</div><div class="num" id="newc">0</div></div>
<div class="stat talk"><div class="label">대화 중</div><div class="num" id="talk">0</div></div>
<div class="stat done"><div class="label">종료</div><div class="num" id="done">0</div></div>
</div>
<div class="layout">
<section class="panel"><div class="panel-title">신고 목록 <button class="refresh" onclick="loadReports()">새로고침</button></div><div id="list" class="list"></div></section>
<section class="panel chat" id="chat"><div class="empty">왼쪽에서 신고를 선택하세요.</div></section>
</div>
</main>
<div class="login" id="login"><div class="loginbox"><h1>PC REPAIR SYSTEM</h1><p>관리자 비밀번호를 입력하세요.</p><input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()"><button onclick="login()">로그인</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyifFoHXBvo0yUqO9kWxdRhPRo8-Fw9n9nKrqLhI1YtvJrdD8yhionCtZjK5YEKVcrrig/exec';
let password=sessionStorage.getItem('adminPassword')||'', reports=[], selected=null;

function jsonp(params){
 return new Promise((resolve,reject)=>{
  const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const s=document.createElement('script');
  params.callback=cb;
  window[cb]=d=>{delete window[cb];s.remove();resolve(d)};
  s.onerror=()=>{delete window[cb];s.remove();reject(new Error('API 연결 실패'))};
  s.src=API+'?'+new URLSearchParams(params);
  document.body.appendChild(s);
 });
}
async function login(){
 const pw=document.getElementById('pw').value.trim();
 if(!pw)return;
 const r=await jsonp({api:'login',password:pw});
 if(r.success){password=pw;sessionStorage.setItem('adminPassword',pw);document.getElementById('login').style.display='none';loadReports()}
 else alert('비밀번호가 틀렸습니다.');
}
function logout(){sessionStorage.removeItem('adminPassword');location.reload()}
async function loadReports(){
 if(!password)return;
 try{
  const r=await jsonp({api:'reports',password});
  if(!r.success){logout();return}
  reports=r.reports||[];
  renderList();updateStats();
  if(selected)loadConversation(selected.id);
 }catch(e){console.error(e)}
}
function updateStats(){
 total.textContent=reports.length;
 newc.textContent=reports.filter(x=>x.status==='접수').length;
 talk.textContent=reports.filter(x=>x.status==='대화 중').length;
 done.textContent=reports.filter(x=>x.status==='대화 종료'||x.status==='처리 완료').length;
}
function renderList(){
 list.innerHTML=reports.length?reports.map(x=>`
 <div class="item ${selected&&selected.id===x.id?'selected':''}" onclick="selectReport('${x.id}')">
  <span class="badge">${esc(x.status)}</span><div class="name">${esc(x.reporterName||'익명')}</div>
  <div class="type">${esc(x.issueType||'기타')}</div><div class="time">${esc(x.time)}</div>
 </div>`).join(''):'<div class="empty">신고가 없습니다.</div>';
}
async function selectReport(id){
 selected=reports.find(x=>x.id===id);renderList();loadConversation(id)
}
async function loadConversation(id){
 const r=await jsonp({api:'conversation',password,reportId:id});
 if(!r.success)return;
 const x=r.report, ms=r.messages||[];
 chat.innerHTML=`<div class="chat-head"><button class="badge">${esc(x.status)}</button><h2>${esc(x.reporterName||'익명')}</h2><div class="meta">${esc(x.issueType||'기타')} · ${esc(x.id)}</div></div>
 <div class="chat-msgs" id="msgs">${ms.map(m=>`<div class="bubble ${m.sender==='관리자'?'admin':'student'}"><div class="sender">${esc(m.sender)}</div>${esc(m.text)}<div class="when">${esc(m.time)}</div></div>`).join('')}</div>
 <div class="composer"><input id="msg" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">전송</button></div>
 <div class="statusbar"><button onclick="setStatus('접수')">접수</button><button onclick="setStatus('대화 중')">대화 중</button><button onclick="setStatus('처리 완료')">처리 완료</button><button onclick="setStatus('대화 종료')">대화 종료</button></div>`;
 const el=document.getElementById('msgs');el.scrollTop=el.scrollHeight;
}
async function sendMsg(){
 const input=document.getElementById('msg');if(!input||!input.value.trim()||!selected)return;
 const r=await jsonp({api:'send',password,reportId:selected.id,message:input.value.trim()});
 if(r.success){input.value='';await loadReports()}else alert(r.message||'전송 실패');
}
async function setStatus(status){
 if(!selected)return;
 const r=await jsonp({api:'status',password,reportId:selected.id,newStatus:status});
 if(r.success){await loadReports()}else alert(r.message||'상태 변경 실패');
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
if(password){document.getElementById('login').style.display='none';loadReports()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
setInterval(()=>{if(password)loadReports()},5000);
</script>
</body></html>
